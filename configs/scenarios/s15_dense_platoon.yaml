scenario:
  scenario_id: S15
  name: dense_platoon
  description: 'Dense three-lane traffic, ten cars at the same speed with headways of about 12 m: a column of four
    in the middle lane (C, D, then the recorders A and B) and three cars in each side lane, staggered, so that every
    car has neighbours ahead, behind or beside it and many lines of sight are blocked.  After six seconds A brakes
    hard; B, behind it, does not react in time and hits A (the only contact).  Everyone else drives on.  A correct
    reconstruction survives the occlusions and re-appearances without merging two same-lane or adjacent-lane road
    users, and names the contact partner.

    '
  research_question: In a dense platoon with adjacent traffic, are fragmented and re-appearing tracks recovered
    without identity confusion?
  map: Town05
  context:
    road_environment: urban arterial, three lanes one direction
    speed_limit_kmh: 50
  max_duration_s: 12.0
  default_variant: dense_platoon
