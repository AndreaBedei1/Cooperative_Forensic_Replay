scenario:
  scenario_id: S16
  name: dense_overtaking
  description: 'Dense three-lane traffic with steady overtaking: the right lane at 10 m/s, the middle lane at 12
    m/s, the left lane at 14 m/s, three cars per lane.  Cars of faster lanes pass those of slower lanes, so the
    longitudinal order changes slowly and pairs drive abreast for a few seconds each.  The recorder B (left lane)
    overtakes the recorder A (middle lane); while B is beside it, A drifts left into B (over 3 s; the only contact).  Everyone
    else drives on.

    '
  research_question: When cars pass each other in dense traffic, do the reconstructed identities stay attached to
    the right road users?
  map: Town05
  context:
    road_environment: urban arterial, three lanes one direction
    speed_limit_kmh: 50
  max_duration_s: 12.0
  default_variant: overtaking
