scenario:
  scenario_id: S12
  name: unobserved_causal_vehicle
  description: 'Three lanes, one direction.  A drives in the middle lane, B in the left
    lane slightly behind it and catching up, C in the right lane a few metres ahead of A
    and 1 m/s slower.  C cuts suddenly into A''s lane just in front of it: about 2 m of
    clearance when A reacts.  A swerves left to avoid C, into B''s path, and A and B
    collide.  C touches nobody, then speeds up and drives away; without the swerve A
    would have run into C.  C is a physical vehicle but not a recorder (record: false):
    no data of its own, so in the reconstruction it can only be one of the recorders''
    anonymous radar tracks.  A''s swerve is triggered by C entering A''s corridor within
    3 m of its front.

    '
  research_question: How does partial observability of a causally relevant but non-colliding
    road user affect accident explanation and attribution?
  map: Town05
  context:
    road_environment: urban road, multiple lanes
    speed_limit_kmh: 50
  default_variant: crash
  max_duration_s: 14.0
  participants:
  - id: A
    blueprint: vehicle.audi.tt
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 20.0
      lane_offset: 0
    route:
      length_m: 200.0
      step_m: 2.0
    initial_speed: 12.0
    target_speed: 12.0
    actions:
    - action_id: A_evasive_swerve_left
      kind: lane_shift
      duration: 1.0
      params:
        lateral_m: -3.5
      trigger:
        kind: corridor_clearance
        target: C
        clearance_m: 3.0
        lateral_margin_m: 0.3
        reaction_s: 0.35
        window_s: [0.0, 8.0]
  - id: B
    blueprint: vehicle.nissan.patrol
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 12.5
      lane_offset: -1
    route:
      length_m: 200.0
      step_m: 2.0
    initial_speed: 13.0
    target_speed: 13.0
    actions: []
  - id: C
    blueprint: vehicle.tesla.model3
    record: false
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 30.75
      lane_offset: 1
    route:
      length_m: 220.0
      step_m: 2.0
    initial_speed: 11.0
    target_speed: 11.0
    post_impact_mode: drive
    actions:
    - action_id: C_cut_in_left
      kind: lane_shift
      t_start: 2.0
      duration: 1.0
      params:
        lateral_m: -3.5
    - action_id: C_drives_away
      kind: set_speed
      t_start: 7.0
      duration: 4.0
      params:
        target_speed: 16.0
  variants:
    crash: {}
