scenario:
  scenario_id: S03
  name: crossing
  description: 'A travels through the junction at constant speed. B approaches from
    a perpendicular direction and accelerates into the crossing instead of yielding,
    striking A.

    '
  map: Town05
  context:
    road_environment: urban junction, perpendicular crossing
    speed_limit_kmh: 50
  default_variant: crash
  max_duration_s: 28.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: junction_approach
      junction_x: 101.6
      junction_y: 0.3
      bearing_deg: 0.0
      back_m: 42.0
    route:
      length_m: 110.0
      step_m: 2.0
      turns:
      - straight
    initial_speed: 10.0
    target_speed: 10.0
    actions: []
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: junction_approach
      junction_x: 101.6
      junction_y: 0.3
      bearing_deg: -90.0
      back_m: 50.0
    route:
      length_m: 110.0
      step_m: 2.0
      turns:
      - straight
    initial_speed: 9.0
    target_speed: 9.0
    actions:
    - action_id: B_fail_to_yield
      kind: set_speed
      t_start: 1.2
      duration: 14.0
      params:
        target_speed: 12.5
  variants:
    crash: {}
