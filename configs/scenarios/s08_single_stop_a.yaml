scenario:
  scenario_id: S08
  name: single_stop_a
  description: 'A faces a stop sign on its approach; B does not. A slows down but
    rolls through the stop line without stopping and is struck by B.  A signals its left turn from 0.5 s,
    before the stop sign comes into view, and is hit during the turn with the indicator still on (never
    switched off: no indicator end).

    '
  map: Town05
  context:
    road_environment: urban junction, STOP sign for A
    speed_limit_kmh: 50
  default_variant: rolls_through
  max_duration_s: 28.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: junction_approach
      junction_x: 152.54
      junction_y: -0.23
      bearing_deg: 0.0
      back_m: 45.0
    route:
      length_m: 110.0
      step_m: 2.0
      turns:
      - left
      turn_lookahead: true
    initial_speed: 9.0
    target_speed: 9.0
    actions: []
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: junction_approach
      junction_x: 152.54
      junction_y: -0.23
      bearing_deg: 90.0
      back_m: 60.0
    route:
      length_m: 240.0
      step_m: 2.0
      turns:
      - straight
      turn_lookahead: true
    initial_speed: 10.0
    target_speed: 10.0
    actions: []
  variants:
    rolls_through:
      participant_overrides:
        A:
          actions:
          - action_id: A_roll_through
            kind: set_speed
            t_start: 2.0
            duration: 14.0
            params:
              target_speed: 5.5
          - action_id: A_indicator_left
            kind: indicator
            t_start: 0.5
            duration: 60.0
            params:
              side: -1
