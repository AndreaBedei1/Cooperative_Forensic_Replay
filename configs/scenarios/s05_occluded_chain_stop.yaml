scenario:
  scenario_id: S05
  name: occluded_chain_stop
  description: 'Three vehicles in one lane: A behind B behind C.  C brakes suddenly to a
    stop; B brakes in time and stops short of C; A reacts too late and runs into the back
    of B.  One collision (A-B), none between B and C.  B stands between A and C, so A''s
    radars see B but C is hidden behind it: whatever A perceives of C is what the body-mounted
    radars can really see past B, with every vehicle carrying the same baseline sensors.

    '
  map: Town05
  context:
    road_environment: urban road, single lane
    speed_limit_kmh: 50
  default_variant: crash
  max_duration_s: 30.0
  participants:
  - id: A
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 0.0
      lane_offset: 0
    route:
      length_m: 150.0
      step_m: 2.0
    initial_speed: 14.0
    target_speed: 14.0
    actions:
    - action_id: A_late_brake
      kind: brake
      t_start: 5.3
      duration: 8.0
      params:
        intensity: 0.8
  - id: B
    blueprint: vehicle.audi.tt
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 24.0
      lane_offset: 0
    route:
      length_m: 130.0
      step_m: 2.0
    initial_speed: 14.0
    target_speed: 14.0
    actions:
    - action_id: B_reaction_brake
      kind: brake
      t_start: 3.7
      duration: 10.0
      params:
        intensity: 1.0
  - id: C
    blueprint: vehicle.tesla.model3
    spawn:
      anchor: spawn_index
      index: 265
      forward_m: 50.0
      lane_offset: 0
    route:
      length_m: 110.0
      step_m: 2.0
    initial_speed: 14.0
    target_speed: 14.0
    actions:
    - action_id: C_emergency_brake
      kind: stop
      t_start: 3.0
      duration: 1.0
  variants:
    crash: {}
