    anonymous_gate_probability: 0.99
    anonymous_min_shared_samples: 10
    anonymous_pass_fraction: 0.8
    stitch_max_gap_s: 1.5
    box_face_std_m: 0.25
    box_length_std_m: 0.7
    box_width_std_m: 0.2
